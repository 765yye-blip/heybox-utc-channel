name: heychat-utc-channel

on:
  schedule:
    # 每 5 分钟触发一次 --once，避免 loop 350 分钟退出后
    # 到下一班 cron 之间出现"频道名卡住不更新"的真空期
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  update-utc-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: 更新 UTC 频道名
        env:
          HEYBOX_TOKEN: ${{ secrets.HEYBOX_TOKEN }}
          ROOM_ID: ${{ vars.ROOM_ID }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID }}
        run: python3 -u utc_channel.py --once
